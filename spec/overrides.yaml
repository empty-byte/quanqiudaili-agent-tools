# 路径 → 工具名、中文描述、标注、拆分与参数修正。人工维护。
# "文档缺陷兜底" 条目在文档站修好后删除。
ignore: # 鉴权接口已随 API Key 改造从文档站下线，留着是为了万一恢复也不暴露
  - /externalapi/user/login
  - /externalapi/user/logout
  - /externalapi/token/check
  - /externalapi/token/refresh

derived: # 从已有工具派生、只取响应 data 里一个字段
  - name: user_balance
    from: /externalapi/user/getUserInfo
    pick: money
    title: 账户余额
    description: 查询当前账号余额，data 直接是金额字符串，单位元。

tools:
  # ===== 只读工具（--readonly 只暴露这些）=====
  /externalapi/user/getUserInfo:
    name: user_info
    title: 账号信息
    description: 查询当前账号的基本信息与余额。
    readOnly: true
  /externalapi/product_price/getProductUnitPrice:
    name: product_unit_price
    title: 产品单价
    description: 查询当前账号各产品的单价和按国家的自定义价。data 按产品 ID 分组：产品 1 单档；产品 6 按 30/90/180 天三档；时长类产品按 7/30/90/180/360 天档位。每档返回 originUnitPrice（平台原价）、userUnitPrice（用户单价）、isCustom（是否设置了自定义价）；customPriceBalance 是自定义价额度。data 里还会出现产品 7（动态次数），可忽略。
    readOnly: true
  /externalapi/conpons/getProductList:
    name: product_list
    title: 产品信息
    description: 查询平台启用的产品列表，返回产品 id、名称和账号后缀。
    readOnly: true
  /externalapi/common/countryList:
    name: dynamic_country_list
    title: 动态产品国家列表
    description: 查询动态住宅流量产品（product_type_id 1 或 6）可选的国家及编码。
    readOnly: true
  /externalapi/common/stateList:
    name: dynamic_state_list
    title: 动态产品州/省列表
    description: 查询动态住宅流量产品某国家下可选的州或省。
    readOnly: true
    params: # 文档只有不限时长一页，后端对 1 和 6 都放行
      product_type_id: { enum: [1, 6] }
      country_code: { description: 国家编码，用 dynamic_country_list 查 }
  /externalapi/common/cityList:
    name: dynamic_city_list
    title: 动态产品城市列表
    description: 查询动态住宅流量产品某国家下可选的城市。
    readOnly: true
    params:
      country_code: { description: 国家编码，用 dynamic_country_list 查 }
  /externalapi/inventory/countryList:
    name: static_country_list
    title: 时长产品国家列表
    description: 查询时长类产品（静态住宅 2/3/4、数据中心 8）可购买的国家及编码。
    readOnly: true
  /externalapi/inventory/cityList:
    name: static_city_list
    title: 时长产品城市列表
    description: 查询时长类产品可选的城市，可按国家筛选；country_id 和 country_code 都不传时返回该产品全部城市，两个都传时必须是同一个国家。
    readOnly: true
    params:
      country_id: { description: 国家 id，取 static_country_list 返回的 id（每个产品一套 id，不能用 static_region_stock 返回的 country_id） }
      country_code: { description: 国家编码，用 static_country_list 查 }
  /externalapi/inventory/getBuyProductSku:
    name: static_region_stock
    title: 时长产品地区库存
    description: 查询时长类产品某国家各地区的库存状态，只给充足或紧缺标签，不给具体数量；结果包含本账号可复用的 IP。数据中心（8）固定返回紧缺，不反映真实库存。返回的 country_id、city_id 属于全球地区库，不能拿去调 static_city_list。
    readOnly: true
    params:
      country_code: { description: 国家编码，用 static_country_list 查 }
  /externalapi/inventory/ipStrList:
    name: static_ip_range_list
    title: 时长产品 IP 段列表
    description: 分页查询时长类产品可指定的 IP 段，供下单时的 appoint_ip 使用。
    readOnly: true
    params: # 工具管理下那页没有固定产品，枚举按后端校验规则给
      product_type_id: { enum: [2, 3, 4, 8] }
      page: { type: integer }
      pagesize: { type: integer }
      country_code: { description: 国家编码，用 static_country_list 查 }
      city_code: { description: 城市编码，取 static_city_list 返回的 code 字段；只有同时传 country_code 时才生效 }
      ip_str: { description: IP 段前缀，只能写前 1 到 2 段，如 104 或 104.223；按字符串前缀匹配，104.2 也会匹配 104.20 到 104.29 和 104.200 到 104.255 }
  /externalapi/product_order/checkInventory:
    name: stock_check
    title: 下单前库存检测
    description: 购买时长 IP 前检测库存是否满足，不下单、不扣费。只统计本地库存池，结果充足也可能在下单时售罄；数据中心（8）选美国以外的国家时恒返回充足。
    readOnly: true
    drop: [bandwidth_num, remark, use_ip_port, random_account_password] # 后端不读这几个参数
    params: # 文档只有 2/3/4 三页，后端同样接受 8
      product_type_id: { enum: [2, 3, 4, 8] }
      appoint_ip: { description: 指定检测哪些 IP 段，每项写一个 IP 段和该段要的数量，所有 count 之和必须等于 num。IP 段用 static_ip_range_list 查 }
      "appoint_ip[0][ip_str]": { description: IP 段前两位，如 104.223，填 static_ip_range_list 返回的 ipStr 值 }
      "appoint_ip[0][count]": { type: integer, description: 该段要的 IP 数量 }
      country: { description: 国家编码，用 static_country_list 查 }
      city: { description: 城市名称，取 static_city_list 返回的 name 字段；不传则按全国统计 }
      timelen: { enum: [0, 1, 2, 3, 4], description: 购买时长：0=7天，1=30天，2=90天，3=180天，4=360天；不影响检测结果 }
  /externalapi/device/accountList:
    name: sub_account_list
    title: 子账号列表
    description: 分页查询子账号，覆盖全部产品类型；返回用户名、密码、端口、协议、国家、流量等。按 searchArr 批量搜索时，一条都没命中会返回不带筛选的全部子账号而不是空列表，要核对返回的是不是要找的子账号。
    readOnly: true
    drop: [subAccountStart, subAccountEnd, subAccountName] # 后端不生效：区间会被搜索结果覆盖，用户名只在代理管理器场景使用
    params:
      search_type: { enum: [0, 1, 2], description: 批量搜索类型，和 searchArr 一起用：0=按自定义用户名精确找，1=按出口 IP 精确找，2=按备注模糊找（多个关键词任一命中即可） }
      searchArr: { description: 批量搜索的值列表，内容由 search_type 决定：自定义用户名、出口 IP 或备注关键词，一次最多 100 个。批量搜索只对时长类产品（2/3/4/8）有效；动态产品（1/6）只能按自定义用户名搜 1 个 }
      "searchArr[]": { description: 单个搜索值 }
      country: { description: 按国家筛选。动态产品用 dynamic_country_list 查编码，时长类产品用 static_country_list }
      exportIp: { description: 按出口 IP 筛选，可填完整 IP 或前缀（如 104.223），按前缀匹配 }
  /externalapi/device/subAccountFlowQuery:
    name: sub_account_flow_query
    title: 动态子账号月度流量
    description: 查询动态住宅流量子账号某个月每天的流量消耗。rows 每项是一天，flow 单位是 MB（不是 GB）；total 是返回的天数。结果缓存 5 分钟；同一账号 1 分钟内最多查询 30 个不同子账号。
    readOnly: true
    params:
      month: { description: 查询的月份，格式 YYYY-MM，如 2026-09 }
      subAccount: { type: string, description: 子账号 id，取 sub_account_list 返回的 id 字段 }
  /externalapi/tool/accountLimitFlow:
    name: sub_account_limit_flow
    title: 子账号流量上限
    description: 查询动态子账号的流量上限设置。use_flow 是定时任务记录的已用量快照，单位字节，不是实时值，没设上限的子账号为 0；要查真实用量用 sub_account_flow_query。没设置过上限时各字段返回 0。
    readOnly: true
    params:
      id: { type: string, description: 子账号 id，取 sub_account_list 返回的 id 字段 }
  /externalapi/bandwidth/getBandwidthList:
    name: bandwidth_package_list
    title: 带宽套餐列表
    description: 查询时长类产品可购买的带宽档位与价格。price 是每 IP 每天、还没乘档位折扣的价格，month_price 是它的 30 倍；实际扣费以下单为准。
    readOnly: true
    params:
      product_type_id: { enum: [2, 3, 4, 8] }
      country: { description: 国家编码，用 static_country_list 查 }
  /externalapi/bandwidth/monitoringList:
    name: bandwidth_monitoring_list
    title: 带宽监控列表
    description: 查询时长类子账号的带宽监控数据。
    readOnly: true
    params:
      product_type_id: { enum: [2, 3, 4, 8] }
      subAccounts: { description: 子账号 id 列表，取 sub_account_list 返回的 id 字段，可一次传多个 }
  /externalapi/bandwidth/monitoringTrend:
    name: bandwidth_trend
    title: 子账号带宽趋势
    description: 查询单个时长类子账号在一段时间内的带宽使用趋势。
    readOnly: true
    params:
      product_type_id: { enum: [2, 3, 4, 8] }
      subAccount: { type: string, description: 子账号 id，取 sub_account_list 返回的 id 字段 }
      trend_type: { type: integer, enum: [1, 2], description: 趋势类型：1=实时，固定最近 60 分钟，忽略时间参数；2=历史，按 startTime 和 endTime 取，跨度最多 2 天，不传默认最近 1 天 }
      startTime: { type: integer, description: 开始时间，Unix 秒级时间戳，只在 trend_type=2 时生效 }
      endTime: { type: integer, description: 结束时间，Unix 秒级时间戳，只在 trend_type=2 时生效 }
  /externalapi/bandwidth/bandwidthNumDetail:
    name: bandwidth_detail
    title: 有效期内带宽详情
    description: 查询子账号剩余有效期内已购带宽的详情。
    readOnly: true
    params:
      product_type_id: { enum: [2, 3, 4, 8] }
      subAccount: { type: string, description: 子账号 id，取 sub_account_list 返回的 id 字段 }
  /externalapi/product_price/bandwidthUpgradePrice:
    name: bandwidth_upgrade_price
    title: 带宽升级价格试算
    description: 计算为子账号升级带宽需要的费用，不下单、不扣费。下单请用 order_bandwidth_upgrade；试算不检查"所有子账号同一国家"和"单次最多 300 个"，下单时会检查。不属于本人或产品不符的子账号会被静默跳过。
    readOnly: true
    params:
      product_type_id: { enum: [2, 3, 4, 8] }
      sub_accounts: { description: 要升级带宽的子账号 id 列表，取 sub_account_list 返回的 id 字段 }
      "sub_accounts[]": { required: true }
      bandwidth_num: { type: integer, required: true, description: 目标带宽，必须是 bandwidth_package_list 返回的某个档位的 num，且大于子账号当前及续费后尚未开始的各段带宽 }

  # ===== 写操作（默认模式才暴露）=====
  /externalapi/device/accountAdd:
    name: sub_account_add
    title: 新增动态子账号
    description: 为动态住宅流量产品（1 或 6）新增子账号，不扣费。
    params:
      country: { required: false, description: 国家编码，用 dynamic_country_list 查；不传或传 ALL 为全球 }
      agree: { required: false, enum: [SOCKS5, HTTP, HTTPS], description: 协议，大写；不传默认 SOCKS5 }
      use_random_username: { enum: [0, 1] }
      limit_flow: { description: 流量上限，单位 GB，0 到 1000000，0 或不传为不限 }
      url: { description: 需要访问的目标网址，我们会根据您提供的目标网址，动态的分配对应ip }
  /externalapi/device/accountUpdate:
    name: sub_account_update
    title: 修改子账号备注
    description: 修改单个子账号的备注。
    params:
      id: { type: string, description: 子账号 id，取 sub_account_list 返回的 id 字段 }
      remark: { required: true, description: 新备注，传空串会清空备注 } # 后端不传 remark 会报错，但修改已经提交
  /externalapi/device/accountUpdateList:
    name: sub_account_update_batch
    title: 批量修改子账号备注
    description: 批量修改多个子账号的备注，ids 为逗号分隔的子账号 id，单次最多 200 个（超过会失败）。
  /externalapi/device/batchUpdateSubAccountUsernamePassword:
    name: sub_account_set_credentials
    title: 自定义子账号账密
    description: 批量给子账号设置自定义用户名和密码，只能用字母和数字，长度 8-30 位；用户名在全平台唯一，重复会报错。
    params:
      product_type_id: { type: integer }
      content: { description: 要设置的子账号列表，每项给子账号 id 和新的用户名、密码，这些子账号都要属于 product_type_id 这个产品 }
      "content[0][id]": { type: string, description: 子账号 id，取 sub_account_list 返回的 id 字段 }
  /externalapi/device/portEnableUpdateList:
    name: sub_account_toggle_direct
    title: 批量开关直连
    description: 批量开启或关闭静态住宅（2/3/4）子账号的 IP 端口直连，ids 为逗号分隔的子账号 id，单次最多 200 个，不能重复，且都要属于这个产品；直连端口固定为 5001。
    params:
      use_ip_port: { enum: [0, 1] }
  /externalapi/tool/accountLimitFlowEdit:
    name: sub_account_set_limit_flow
    title: 设置子账号流量上限
    description: 为动态子账号设置流量上限；limit_flow 为 0 表示取消限制。新上限低于已用量时，该子账号会立即停用并断开正在使用的连接；调高上限（不低于已用量）或设为 0 会解除停用。
    params: # 文档没有给 type、timelen 枚举，类型也不统一
      id: { type: string, description: 子账号 id，取 sub_account_list 返回的 id 字段 }
      type: { type: integer, enum: [0, 1], description: 限流类型：0 = 永久，按子账号累计用量（默认）；1 = 周期 }
      timelen: { type: integer, enum: [0, 1, 2, 4], description: 周期：0 天、1 周、2 月、4 年；type=1 时应传，不传按天；type=0 时忽略 } # 季度（3）后端算不对周期起点，会退化成永久限流，不开放
  /externalapi/device/accountDelete:
    name: sub_account_delete
    title: 删除单个子账号
    description: 不可恢复。删除一个动态子账号。
    destructive: true
    params:
      id: { type: string, description: 子账号 id，取 sub_account_list 返回的 id 字段 }
  /externalapi/device/accountDeleteList:
    name: sub_account_delete_batch
    title: 批量删除子账号
    description: 不可恢复。批量删除动态子账号，ids 为逗号分隔的子账号 id。
    destructive: true
  /externalapi/product_order/createProductBuyOrder:
    split:
      - name: order_buy_dynamic
        productTypeIds: [1, 6]
        title: 购买动态住宅流量
        description: 会从账户余额扣费。购买动态住宅流量，num 为 GB 数（1-300，要买更多请分几次下单）：产品 1 不限时长；产品 6 为包月，一次性加 num GB，有效期由 bill_timelen 决定，到期没用完的流量会被扣掉。下单前先用 product_unit_price 查价、user_balance 查余额，并向用户确认。
        destructive: true
        params:
          bill_timelen: { enum: [1, 2, 3], description: 包月有效时长：1=30天，2=90天，3=180天；产品 6 必填，产品 1 忽略 }
      - name: order_buy_time_ip
        productTypeIds: [2, 3, 4, 8]
        title: 购买时长 IP
        description: 会从账户余额扣费。购买静态住宅（2/3/4）或数据中心（8）时长 IP，num 为 IP 数量（1-300，数据中心单次最多 50）；数据中心不卖 7 天。下单前先用 stock_check 检测库存、product_unit_price 查价，并向用户确认。
        destructive: true
        drop: [agree] # 后端建子账号一律用 SOCKS5，不读 agree
        params:
          num: { description: 需要购买的 IP 数量，1-300；数据中心（8）单次最多 50 }
          appoint_ip: { description: 指定从哪些 IP 段购买，每项写一个 IP 段和该段要买的数量，所有 count 之和必须等于 num；不传则由系统随机分配。IP 段用 static_ip_range_list 查 }
          "appoint_ip[0][ip_str]": { description: IP 段前两位，如 104.223，填 static_ip_range_list 返回的 ipStr 值 }
          "appoint_ip[0][count]": { type: integer, description: 该段要买的 IP 数量 }
          country: { description: 国家编码，用 static_country_list 查 }
          city: { description: 城市名称，取 static_city_list 返回的 name 字段；不传则随机 }
          bandwidth_num: { type: integer, description: 带宽加购，单位 Mbps，不传默认 5；可选档位和价格用 bandwidth_package_list 按产品和国家查，填返回的 num；数据中心（8）没有带宽加购，不要传 }
          timelen: { enum: [0, 1, 2, 3, 4], description: 购买时长：0=7天，1=30天，2=90天，3=180天，4=360天；数据中心（8）不卖 7 天，不能选 0 }
          use_ip_port: { enum: [0, 1] }
          random_account_password: { enum: [0, 1] }
  /externalapi/product_order/createTestOrder:
    name: order_buy_test_ip
    title: 购买时长测试 IP
    description: 会从账户余额扣费，金额是账号等级的测试单价 × 数量，另加带宽费，和时长无关。购买短期测试用的时长 IP，子账号建在调用者自己名下；只有已实名的代理商账号能调用，普通账号会被拒绝。
    destructive: true
    drop: [agree] # 后端不读 agree，测试 IP 一律 SOCKS5
    params:
      timelen: { description: 测试时长档位，单位小时。传 12 表示标准测试，实际开通时长按账号等级配置（不一定是 12 小时）；账号有特殊测试配置时，可传配置里的小时数 }
      bandwidth_num: { type: integer, enum: [5, 10, 15], description: 带宽，单位 Mbps，不传默认 5。标准测试（timelen=12）只能选 5；10 和 15 只在特殊测试时长、且账号等级配了价格时可用 }
      country: { description: 国家编码，必须大写，用 static_country_list 查 }
      city: { description: 城市名称，取 static_city_list 返回的 name 字段；不传则随机 }
  /externalapi/product_order/createRenewProductBuyOrder:
    name: order_renew
    title: 续费时长 IP
    description: 会从账户余额扣费。为时长类子账号续费，sub_account_ids 为逗号分隔的子账号 id。数据中心不能续 7 天。不会改动子账号的自动续费开关，但会把本次续费时长写成子账号以后自动续费的时长；renew_with_bandwidth 不传时沿用各子账号当前设置，子账号之间设置不一致时请分开续费。
    destructive: true
    drop: [is_renew] # 后端会把 is_renew 写回自动续费开关，由 src/renew.ts 沿用各子账号当前值，不交给模型
    params:
      timelen: { enum: [0, 1, 2, 3, 4], description: 续费时长：0=7天，1=30天，2=90天，3=180天，4=360天；数据中心（8）不能续 7 天，不能选 0 }
      sub_account_ids: { description: 要续费的子账号 id，多个用英文逗号连接，一次最多 300 个 }
      renew_with_bandwidth: { enum: [0, 1], description: 续费时是否包含带宽：1=按当前带宽续；0=不包含，续费期带宽按 5M 计价，当前带宽周期结束后回落到 5M。不传则沿用子账号当前的自动续费带宽设置；传了会同时改掉该设置 }
  /externalapi/product_order/createBandwidthUpgradeOrder:
    name: order_bandwidth_upgrade
    title: 带宽升级下单
    description: 会从账户余额扣费。为时长类子账号升级带宽，立即生效。所有子账号必须属于同一国家，单次最多 300 个，已过期的不能升级；失败时后端只返回笼统的"带宽升级订单创建失败"，所以先用 bandwidth_upgrade_price 试算并向用户确认。
    destructive: true
    fixed: { pay_method: balance }
    drop: [pay_method]
    params:
      subAccountIds: { description: 要升级带宽的子账号 id 列表，取 sub_account_list 返回的 id 字段；和 bandwidth_upgrade_price 试算时是同一批子账号，只是那边的参数名叫 sub_accounts }
      "subAccountIds[]": { required: true }
      product_type_id: { enum: [2, 3, 4, 8] }
      bandwidth_num: { type: integer, required: true, description: 目标带宽，必须是 bandwidth_package_list 返回的某个档位的 num，且大于子账号当前带宽 }
  /externalapi/order_back/createOrderBack:
    name: order_refund_apply
    title: 申请退单
    description: 为某个购买订单下的时长类子账号申请退单；不同订单的子账号请分别调用。只能退下单 1 天内、已支付、未开发票的购买订单，续费、赠送、带宽升级等订单都不能退；子账号有续费记录或带宽升级订单时不能退，申请过的子账号不能重复申请；单次可退数量有上限（默认 30 个）。提交后由上级代理商或平台审核，审核通过后这些子账号会被删除。
    params:
      order_product_buy_id: { required: true }
      ids: { description: 要退的子账号 id 列表，取 sub_account_list 返回的 id 字段。这些子账号必须是同一个订单买出来的，订单看子账号列表里每条的 order_product_buy_id 字段 }
      "ids[]": { required: true }
      remark: { description: 退单原因 }
